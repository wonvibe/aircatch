# Render Blueprint for the NestJS API (apps/api). Import this file when
# creating the service on Render (New > Blueprint) so build/start commands
# and the health check are pre-filled instead of typed by hand.
#
# Secrets (marked `sync: false` below) are NOT stored here — Render prompts
# for them once at setup and keeps them in its own dashboard, matching the
# values already in the repo's .env (never commit that file).
services:
  - type: web
    name: aircatch-api
    runtime: node
    plan: free
    region: singapore
    # Two things NOT to use here, both tried and failed:
    #  - `corepack enable`/`corepack prepare`: Render's Node 20.18.0 image's
    #    corepack throws ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING loading
    #    pnpm's CJS bundle (a corepack bug, not specific to this app).
    #  - `npm install -g pnpm`: on the Node 24 image, pnpm ships
    #    pre-installed under a read-only /usr/lib, and npm's global install
    #    tries to rename that directory aside — EROFS.
    # `npx -y pnpm@<version>` sidesteps both: it runs a local (per-project
    # cache) copy of the exact pinned version, never touching corepack or
    # any global/read-only install path. `-y` is required — without it npx
    # blocks on an interactive "ok to install?" prompt that never resolves
    # in a non-interactive build shell.
    buildCommand: npx -y pnpm@11.22.0 install --frozen-lockfile && npx -y pnpm@11.22.0 --filter @aircatch/api build
    startCommand: npx -y pnpm@11.22.0 --filter @aircatch/api start:prod
    healthCheckPath: /health
    envVars:
      # 20.18.0 (Render's default) hit ERR_UNKNOWN_BUILTIN_MODULE: undici
      # (a transitive HTTP-client dependency) requires node:sqlite, a
      # built-in only present from Node 22.5+. Pinned to the exact version
      # already verified locally throughout this project's build.
      - key: NODE_VERSION
        value: 24.14.1
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
