# Render Blueprint for the NestJS API (apps/api). Import this file when
# creating the service on Render (New > Blueprint) so build/start commands
# and the health check are pre-filled instead of typed by hand.
#
# Secrets (marked `sync: false` below) are NOT stored here — Render prompts
# for them once at setup and keeps them in its own dashboard, matching the
# values already in the repo's .env (never commit that file).
services:
  - type: web
    name: aircatch-api
    runtime: node
    plan: free
    region: singapore
    # Not using `corepack enable`/`corepack prepare` — Render's Node 20.18.0
    # image ships a corepack build that throws
    # ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING when it tries to load pnpm's
    # CJS bundle (a known corepack bug, not specific to this app). Installing
    # pnpm directly via npm sidesteps corepack entirely.
    buildCommand: npm install -g pnpm@11.22.0 && pnpm install --frozen-lockfile && pnpm --filter @aircatch/api build
    startCommand: pnpm --filter @aircatch/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
