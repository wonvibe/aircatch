name: Keep API awake

# Render's free plan spins the API down after 15 minutes with no traffic;
# the next request then pays a 30-90s cold-start, which the mobile app
# surfaces as a dropped connection. Ping /health well inside that window
# so the service never goes to sleep during normal hours.
#
# Note: GitHub auto-disables scheduled workflows after 60 days without a
# push to the repo — re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 100 https://aircatch-api.onrender.com/health)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
          done
          echo "health check failed after 3 attempts"
          exit 1
